[build-system]
build-backend = "setuptools.build_meta"
requires = ["setuptools>=77.0.3"]

[project]
# https://packaging.python.org/en/latest/specifications/declaring-project-metadata/
name = "inferlo"
version = "0.3.2"
description = "Inference, Learning & Optimization with Graphical Models"
readme = "README.md"
requires-python = ">=3.12"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "The InferLO Developers" }]

# https://pypi.org/classifiers/
classifiers = [
    "Development Status :: 3 - Alpha",
    "Topic :: Scientific/Engineering :: Mathematics",
]

# https://peps.python.org/pep-0508/
dependencies = [
    "cvxpy>=1.1.1",
    "networkx~=2.5",
    "numba>=0.67",
    "numpy>=2.5",
    "scikit-learn>=0.18",
    "scipy>=1.4",
    "wget>=3.0",
]

# Development dependencies
# python -m pip install -e ".[lint,test,docs]"
[project.optional-dependencies]
lint = [
    "pycodestyle",
    "pylint",
    "autopep8",
]
test = [
    "pytest",
]
docs = [
    # Libraries needed to build documentation.
    "ipython",
    "sphinx",
    "sphinx_rtd_theme",
    "myst-parser",
    "sphinx-autodoc-typehints",
    "pypandoc",
    "nbsphinx",
]

[project.urls]
"Homepage" = "https://github.com/inferlo/inferlo"
"Documentation" = "https://inferlo.github.io/inferlo"

[tool.setuptools.packages.find]
include = ["inferlo*"]
namespaces = false

[tool.black]
line-length = 100